name: Demo en GitHub Pages

# Publishes the in-browser mock demo (no backend, synthetic data) at
# https://<user>.github.io/Explanada/. Requires Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build mock demo for /Explanada/
        run: npm run build:pages
      - name: SPA fallback
        run: cp dist-mock/index.html dist-mock/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-mock

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
